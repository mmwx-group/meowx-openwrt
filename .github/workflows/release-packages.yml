name: release-packages

# 打 tag（v*）自动编译全部架构、签名，发 GitHub Release 并推 CDN（软件源 dl.miaomiaowux.com/meowx/openwrt + latest.json）；
# 也可手动触发（workflow_dispatch），在 main 上且勾了 publish 才推 CDN。带 '-' 的 tag（如 v0.2.0-pre1）只发 GitHub 预发布、不推 CDN。
# 需要仓库 secrets：KEY_BUILD / KEY_BUILD_PUB（opkg 用的 usign 密钥对）、PRIVATE_KEY / PUBLIC_KEY（apk 用的 ECDSA 密钥对）、
# R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY；可选 variables.R2_BUCKET（默认 mmwx-dl）。
on:
  workflow_dispatch:
    inputs:
      publish:
        description: '编译完推到 CDN（dl.miaomiaowux.com 软件源，更新 latest.json）'
        type: boolean
        default: true
  push:
    tags:
      - v*

jobs:
  release:
    name: ${{ matrix.arch }}-${{ matrix.branch }} release
    # 自建 runner（LAX，标签 lax）：3 个并发实例串着跑全部架构。feed 作业仍留 GitHub 托管。
    runs-on: [self-hosted, lax]
    continue-on-error: true
    # 建 GitHub Release 要写权限（组织缺省给工作流的令牌是只读）
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a8_vfpv3
          - arm_cortex-a9
          - arm_cortex-a9_vfpv3-d16
          - arm_cortex-a9_neon
          - arm_cortex-a15_neon-vfpv4
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_cortex-a76
          - aarch64_generic
          - mips_24kc
          - mips_4kec
          - mips_mips32
          - mipsel_24kc
          - mipsel_24kc_24kf
          - mipsel_74kc
          - mipsel_mips32
          - mips64_octeonplus
          - riscv64_riscv64
          - riscv64_generic
          - loongarch64_generic
          - i386_pentium4
          - x86_64
        branch:
          - openwrt-24.10
          - openwrt-25.12
          - SNAPSHOT
        exclude:
          - arch: mips_4kec
            branch: openwrt-25.12
          - arch: mips_4kec
            branch: SNAPSHOT
          - arch: riscv64_riscv64
            branch: openwrt-25.12
          - arch: riscv64_riscv64
            branch: SNAPSHOT
          - arch: riscv64_generic
            branch: openwrt-24.10
          # 24.10 的 SDK 编 meowx-core 失败（25.12 / SNAPSHOT 正常），先不出这一组
          - arch: loongarch64_generic
            branch: openwrt-24.10

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          FEEDNAME: meowx
          PACKAGES: meowx-core meowx luci-app-meowx
          INDEX: 1
          KEY_BUILD: ${{ secrets.KEY_BUILD }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          NO_REFRESH_CHECK: true

      - name: compress
        run: |
          tar -c -z -f meowx_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz -C bin/packages/${{ matrix.arch }}/meowx .
          mkdir -p public/${{ matrix.branch }}/${{ matrix.arch }}
          mv bin/packages/${{ matrix.arch }}/meowx public/${{ matrix.branch }}/${{ matrix.arch }}
          tar -c -z -f feed_meowx_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz public/${{ matrix.branch }}/${{ matrix.arch }}

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: feed_meowx_${{ matrix.arch }}-${{ matrix.branch }}
          path: feed_meowx_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz

      - if: github.event_name == 'push' && startsWith(github.ref_name, 'v')
        name: release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            meowx_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz
          prerelease: ${{ contains(github.ref_name, '-') }}

      # 自建 runner 的工作区与 docker 不自动清，63 个架构轮着跑会把盘撑爆：
      # 删掉本次产物、清掉本作业用完的 docker 镜像（并发中的其它作业镜像在用、不会被清）。
      - name: cleanup
        if: always()
        run: |
          rm -rf bin build_dir dl 2>/dev/null || true
          docker image prune -af 2>/dev/null || true
          docker builder prune -af 2>/dev/null || true

  # 推到 CDN：软件源同步到 R2 的 meowx/openwrt/（不带 --delete：某个架构这次没编过时保留线上上一版），
  # 再把 openwrt 条目登记进 meowx/latest.json（文档站下载页读它）。正式 tag 自动推；手动触发在 main 上且勾了 publish 才推。
  feed:
    needs: release
    if: >-
      ${{ !cancelled()
          && ((startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-'))
              || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')) }}
    name: feed
    runs-on: ubuntu-latest
    concurrency:
      group: publish-cdn
      cancel-in-progress: false

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: download
        uses: actions/download-artifact@v8
        with:
          pattern: feed_meowx_*
          merge-multiple: true

      - name: uncompress
        run: |
          for file in feed_meowx_*.tar.gz; do tar -x -z -f "$file"; done

      - name: version
        id: version
        run: |
          version=$(sed -n 's/^PKG_VERSION:=//p' meowx/Makefile)
          build=$(sed -n 's/^PKG_RELEASE:=//p' meowx/Makefile)
          core=$(sed -n 's/^PKG_VERSION:=//p' meowx-core/Makefile)
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 meowx/Makefile 的 PKG_VERSION ${version} 不一致"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "发布 ${version} (${build})，内核 ${core}"

      - name: prepare
        env:
          KEY_BUILD_PUB: ${{ secrets.KEY_BUILD_PUB }}
          PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
        run: |
          [ -n "$KEY_BUILD_PUB" ] && [ -n "$PUBLIC_KEY" ] || { echo "::error::缺少仓库 secret KEY_BUILD_PUB / PUBLIC_KEY"; exit 1; }
          printf '%s\n' "$KEY_BUILD_PUB" > public/key-build.pub
          printf '%s\n' "$PUBLIC_KEY" > public/public-key.pem
          cp feed.sh install.sh uninstall.sh public/
          tree --dirsfirst --sort name -P '*.apk|*.ipk' --prune --noreport -H "" -T "MeowX OpenWrt Feed" --charset utf-8 -o public/index.html public
          sed -i '/<p class="VERSION">/,/<\/p>/d' public/index.html

      - name: test publish script
        run: python3 -m unittest scripts/test_publish_cdn.py

      # 软件源与客户端下载在同一个 R2 桶（dl.miaomiaowux.com），凭据与 meowC 的 publish-cdn 同名
      - name: feed
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_BUCKET: ${{ vars.R2_BUCKET || 'mmwx-dl' }}
        run: |
          aws --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            s3 sync public "s3://${R2_BUCKET}/meowx/openwrt" --cache-control "no-cache"

      - name: manifest
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          python3 scripts/publish_cdn.py --version "${{ steps.version.outputs.version }}" \
            --build "${{ steps.version.outputs.build }}" --core "${{ steps.version.outputs.core }}"
